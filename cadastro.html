<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar usuário</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen">
   
    <main class="main">
      <h1 class="center">Entre com seus dados abaixo:</h1>

      <!-- O script.js faz a validação e salva no LocalStorage -->
      <form id="registerForm" class="mt-4">
        <label>E-mail</label>
        <input class="input" type="email" name="email" placeholder="Seu e-mail" required>

        <label class="mt-4">Senha</label>
        <input class="input" type="password" name="password" placeholder="Crie uma senha" required>

        <label class="mt-4">Confirmar senha</label>
        <input class="input" type="password" name="confirm" placeholder="Repita a senha" required>

        <button class="btn mt-8" type="submit">Cadastrar</button>
        <a class="btn link mt-4" href="login.html">Voltar ao login</a>
      </form>
    </main>

    <div class="footer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
